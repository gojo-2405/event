name: Deploy Services


# Environment mapping
#   branch development → env "dev"    cluster "etx-dev"     service "dev-<svc>"
#   branch qa          → env "qa"     cluster "etx-qa"      service "qa-<svc>"
#   branch master      → env "master" cluster "etx-master"  service "master-<svc>"
#
# Region: London (eu-west-2)
# ───────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [development, qa, master]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: development
        options: [development, qa, master]
      service:
        description: "Service to deploy"
        type: choice
        required: true
        default: all
        options:
          - all
          - api-gateway
          - auth-service
          - booking-service
          - event-service
          - worker-service

concurrency:
  group: deploy-services-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required to request the OIDC token for AWS role assumption

env:
  AWS_REGION: eu-north-1 # London
  ECR_PREFIX: etx # ECR repositories are named "<ECR_PREFIX>-<service>"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      prefix: ${{ steps.resolve.outputs.prefix }}
      cluster: ${{ steps.resolve.outputs.cluster }}
      services: ${{ steps.resolve.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve environment & services
        id: resolve
        env:
          ALL_SERVICES: '["api-gateway","auth-service","booking-service","event-service","worker-service"]'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          else
            case "${GITHUB_REF_NAME}" in
              development) ENVIRONMENT="development" ;;
              qa)          ENVIRONMENT="qa" ;;
              master)      ENVIRONMENT="master" ;;
              *) echo "::error::Unsupported branch ${GITHUB_REF_NAME}"; exit 1 ;;
            esac
          fi

          case "${ENVIRONMENT}" in
            development) PREFIX="dev" ;;
            *)           PREFIX="${ENVIRONMENT}" ;;
          esac

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.service }}" != "all" ]; then
              SERVICES="[\"${{ github.event.inputs.service }}\"]"
            else
              SERVICES="${ALL_SERVICES}"
            fi
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit to diff against — deploying all services."
              SERVICES="${ALL_SERVICES}"
            else
              CHANGED_FILES=$(git diff --name-only "${BEFORE_SHA}" "${{ github.sha }}")
              echo "Changed files:"
              echo "${CHANGED_FILES}"

              if echo "${CHANGED_FILES}" | grep -q '^packages/'; then
                echo "Shared packages/ changed — deploying all services."
                SERVICES="${ALL_SERVICES}"
              else
                CHANGED_SERVICES="[]"
                for svc in api-gateway auth-service booking-service event-service worker-service; do
                  if echo "${CHANGED_FILES}" | grep -q "^apps/${svc}/"; then
                    CHANGED_SERVICES=$(echo "${CHANGED_SERVICES}" | jq -c --arg s "$svc" '. + [$s]')
                  fi
                done
                SERVICES="${CHANGED_SERVICES}"
              fi
            fi
          fi

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}"            >> "$GITHUB_OUTPUT"
          echo "cluster=${PREFIX}"       >> "$GITHUB_OUTPUT"
          echo "services=${SERVICES}"        >> "$GITHUB_OUTPUT"

          echo "Environment: ${ENVIRONMENT}"
          echo "Prefix:      ${PREFIX}"
          echo "Cluster:     etx-${PREFIX}"
          echo "Services:    ${SERVICES}"

  deploy:
    needs: setup
    if: ${{ needs.setup.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.setup.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment values
        id: config
        run: |
          set -euo pipefail
          PREFIX="${{ needs.setup.outputs.prefix }}"
          ENVIRONMENT="${{ needs.setup.outputs.environment }}"
          SERVICE="${{ matrix.service }}"

          IMAGE_TAG="${ENVIRONMENT}-${{ github.run_number }}"

          echo "ecr_repository=${{ env.ECR_PREFIX }}-${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=${PREFIX}"                       >> "$GITHUB_OUTPUT"
          echo "ecs_service=${PREFIX}-${SERVICE}"                >> "$GITHUB_OUTPUT"
          echo "container_name=${PREFIX}-${SERVICE}"             >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}"                          >> "$GITHUB_OUTPUT"

      # 🐛 TEMPORARY — decode and print the OIDC token's claims so we can
      #   compare the actual `sub`/`aud` GitHub sends against the AWS trust
      #   policy. Remove this step once the AssumeRoleWithWebIdentity issue
      #   is resolved — it's diagnostic only, safe to delete anytime.
      - name: Debug OIDC token claims
        run: |
          set -euo pipefail
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "Decoded OIDC token claims:"
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      # 🔐 AWS credentials via OIDC — full role ARN stored as a secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          REPOSITORY: ${{ steps.config.outputs.ecr_repository }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "${REPOSITORY}" >/dev/null 2>&1; then
            echo "Repository ${REPOSITORY} not found — creating it."
            aws ecr create-repository \
              --repository-name "${REPOSITORY}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE
          else
            echo "Repository ${REPOSITORY} already exists."
          fi

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ steps.config.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.config.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          LATEST="${REGISTRY}/${REPOSITORY}:latest"
          docker build \
            -f "apps/${{ matrix.service }}/Dockerfile" \
            --build-arg SERVICE=${{ matrix.service }} \
            -t "${IMAGE}" \
            -t "${LATEST}" \
            .
          docker push "${IMAGE}"
          docker push "${LATEST}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Fetch Task Definition
        env:
          ECS_SERVICE: ${{ steps.config.outputs.ecs_service }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${{ steps.config.outputs.ecs_cluster }}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].taskDefinition" \
            --output text)
          echo "Current task definition: $TASK_DEF_ARN"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition \
            > task-definition.json

      - name: Clean Task Definition
        run: |
          cat task-definition.json | jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .enableFaultInjection
          )' > cleaned-task-def.json 

      - name: Render Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: cleaned-task-def.json
          container-name: ${{ steps.config.outputs.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ steps.config.outputs.ecs_service }}
          cluster: ${{ steps.config.outputs.ecs_cluster }}
          wait-for-service-stability: true

      - name: Notify Slack
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          ECS_SERVICE: ${{ steps.config.outputs.ecs_service }}
          ECS_CLUSTER: ${{ steps.config.outputs.ecs_cluster }}
          TASK_DEF_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi

          case "${JOB_STATUS}" in
            success)   ICON=":white_check_mark:"; WORD="SUCCESS";  COLOR="#2eb67d"; BTN_STYLE="primary" ;;
            failure)   ICON=":x:";                WORD="FAILURE";  COLOR="#e01e5a"; BTN_STYLE="danger" ;;
            cancelled) ICON=":no_entry:";         WORD="ABORTED";  COLOR="#dbab09"; BTN_STYLE="" ;;
            *)         ICON=":grey_question:";    WORD="${JOB_STATUS^^}"; COLOR="#808080"; BTN_STYLE="" ;;
          esac

          if [ -n "${TASK_DEF_ARN}" ]; then
            TASK_DEF="${TASK_DEF_ARN##*/}"
          else
            TASK_DEF="n/a"
          fi

          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg icon    "${ICON}" \
            --arg word    "${WORD}" \
            --arg service "${ECS_SERVICE}" \
            --arg cluster "${ECS_CLUSTER}" \
            --arg author  "${GITHUB_ACTOR}" \
            --arg branch  "${GITHUB_REF_NAME}" \
            --arg build   "#${GITHUB_RUN_NUMBER}" \
            --arg taskdef "${TASK_DEF}" \
            --arg color   "${COLOR}" \
            --arg url     "${BUILD_URL}" \
            --arg btnstyle "${BTN_STYLE}" \
            '{
              text: ($word + ": Deploy " + $service + " to ECS  (" + $build + ")"),
              attachments: [
                {
                  color: $color,
                  fallback: ($word + ": Deploy " + $service + " to ECS  (" + $build + ")"),
                  blocks: [
                    { type: "section",
                      text: { type: "mrkdwn",
                              text: ($icon + "  *" + $word + ": Deploy " + $service + " to ECS*") } },
                    { type: "section",
                      text: { type: "mrkdwn",
                              text: (
                                ":bust_in_silhouette:  *Author Name:* " + $author + "\n" +
                                ":herb:  *Branch name:* " + $branch + "\n" +
                                ":bookmark:  *Build number:* " + $build + "\n" +
                                ":clipboard:  *Task Definition number:* " + $taskdef
                              ) } },
                    { type: "actions",
                      elements: [
                        ( { type: "button",
                            text: { type: "plain_text", text: "View Workflow", emoji: true },
                            url: $url }
                          + (if $btnstyle != "" then { style: $btnstyle } else {} end) )
                      ] },
                    { type: "context",
                      elements: [ { type: "mrkdwn", text: ("Cluster `" + $cluster + "`  •  Added by AOK CI/CD Bot") } ] }
                  ]
                }
              ]
            }')

          curl -sSf -X POST -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" "${SLACK_WEBHOOK_URL}"
